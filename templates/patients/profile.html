{% extends 'base.html' %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="container lc-section">
    <a href="{% url 'patient_dashboard' %}" class="text-muted">&larr; Back to dashboard</a>

    <div class="lc-form-card">
        <h2 class="mb-1">Edit Your Profile</h2>
        <p class="text-muted mb-4">Patient ID: <strong>{{ profile.patient_id }}</strong> (cannot be changed)</p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">First Name</label>
                <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Last Name</label>
                <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone_number" class="form-control" value="{{ user.phone_number }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Date of Birth</label>
                <input type="date" name="date_of_birth" class="form-control" value="{{ profile.date_of_birth|date:'Y-m-d' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Gender</label>
                <select name="gender" class="form-select">
                    <option value="">Select...</option>
                    <option value="Male" {% if profile.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if profile.gender == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if profile.gender == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea name="address" class="form-control" rows="3">{{ profile.address }}</textarea>
            </div>
            <button type="submit" class="btn btn-lc-primary w-100">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
