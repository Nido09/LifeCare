{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="container lc-section">
    <div class="lc-form-card">
        <h2 class="mb-1">Reset Your Password</h2>
        <p class="text-muted mb-4">Enter your registered email and we'll send you a link to reset your password.</p>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Email</label>
                {{ form.email.errors }}
                <input type="email" name="email" class="form-control" required autofocus>
            </div>
            <button type="submit" class="btn btn-lc-primary w-100">Send Reset Link</button>
        </form>
        <p class="mt-3 mb-0"><a href="{% url 'login' %}">Back to Login</a></p>
    </div>
</div>
{% endblock %}
